name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      # Keep Argon2 cheap in CI so tests stay fast; real files still record
      # whatever value was actually used.
      THEX_ARGON2_MEMORY_KIB: "65536"
      # No real display in CI - PySide6 tests run against Qt's "offscreen"
      # platform plugin (tests/conftest.py sets the same default locally).
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # PySide6's offscreen plugin still links against a handful of system
      # libraries (OpenGL/EGL, xkbcommon, DBus) that Ubuntu runners don't
      # ship by default - without these, importing PySide6 fails at the
      # shared-library level, not at the Python level.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest
