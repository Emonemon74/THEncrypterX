[project]
name = "thencrypterx"
version = "0.1.0"
description = "Secure file encryption system with authenticated encryption and a versioned container format"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Emon Joseph Dewan", email = "emondewan994@gmail.com" },
]
dependencies = [
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "psutil>=6.0",
]

[project.scripts]
thencrypterx = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["app.gui.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
